name: iOS original-web validation

"on":
  push:
    paths:
      - 'folio-ios/**'
      - 'folio-prototype/**'
      - 'folio-android/release_assets.py'
      - '.github/workflows/ios-webview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-webview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: iPhone ${{ matrix.size }}
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        size: [compact, regular]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile, run WKWebView, take screenshots, test keyboard and swipes
        env:
          TZ: Asia/Shanghai
        run: python3 folio-ios/tools/ci_run.py --size '${{ matrix.size }}'
      - name: Upload simulator evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-webview-${{ matrix.size }}
          path: folio-ios/Reports/${{ matrix.size }}/
          retention-days: 7
          if-no-files-found: error
      - name: Upload a small screenshot and JSON review bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-review-${{ matrix.size }}
          path: |
            folio-ios/Reports/${{ matrix.size }}/screens/
            folio-ios/Reports/${{ matrix.size }}/attachments/
            folio-ios/Reports/${{ matrix.size }}/ci-result.json
            folio-ios/Reports/${{ matrix.size }}/web-assets-manifest.json
            folio-ios/Reports/${{ matrix.size }}/native-final.png
          retention-days: 7
          if-no-files-found: warn
