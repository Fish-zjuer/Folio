<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio · 手机尺寸预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e5e0d5;color:#998b74;font:12px "Microsoft YaHei",sans-serif}header{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;padding:20px}button,a{border:1px solid #c6baa4;background:transparent;border-radius:4px;padding:8px 12px;color:inherit;text-decoration:none;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#f6f4ed;color:#8a7150}.phone{width:390px;max-width:100%;height:780px;margin:0 auto 28px;background:#f6f4ed;box-shadow:4px 5px 0 #c8bfad;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}p{text-align:center;font-size:10px;line-height:1.8;margin:0 18px 20px}</style>
<header><span>手机宽度</span><button data-width="320" aria-pressed="false">320</button><button data-width="360" aria-pressed="false">360</button><button data-width="390" aria-pressed="true">390</button><button data-width="430" aria-pressed="false">430</button><a href="widget-picker.html">完整页面 ↗</a></header>
<div class="phone" id="phone"><iframe id="phone-page" src="widget-picker.html" title="手机中的组件选择页"></iframe></div><p id="viewport-report" aria-live="polite"></p><p>这是实际页面在窄视窗中的排布，内容可以在手机框内滚动。<br>浏览器尺寸检查不代表已经通过真机体验测试。</p>
<script>document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{document.querySelector('#phone').style.width=b.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});const phoneFrame=document.querySelector("#phone-page"),phoneReport=document.querySelector("#viewport-report");function report(){const doc=phoneFrame.contentDocument;if(!doc)return;const w=doc.documentElement.clientWidth,content=Math.max(doc.documentElement.scrollWidth,doc.body.scrollWidth);phoneReport.textContent="视窗 "+w+"px · 内容 "+content+"px · "+(content<=w?"无横向溢出":"存在横向溢出")}phoneFrame.addEventListener("load",report);new ResizeObserver(report).observe(phoneFrame);</script></html>
