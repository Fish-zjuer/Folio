<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio · 矩形样张</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#F6F4ED;color:#292720;font-family:"Microsoft YaHei","PingFang SC",sans-serif}main{max-width:980px;margin:auto;padding:44px 38px 28px}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:30px}h1{font-family:Georgia,"Songti SC",serif;font-size:36px;font-weight:400;letter-spacing:-1px;margin:5px 0}small,.caption{font-size:11px;line-height:1.7;color:#7F7B70}.eyebrow{font:11px Georgia,serif;letter-spacing:2px}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.choice{display:block;width:100%;text-align:left;border:0;border-top:1px solid #DCD7CA;background:none;padding:13px 0 0;cursor:pointer;color:inherit}.choice[aria-pressed=true]{border-top:2px solid #A85F45;padding-top:12px}.choice h2{margin:0 0 9px;font-size:13px;font-weight:400;display:flex;justify-content:space-between;gap:10px}.choice h2 span{color:#8A8273;font-size:10px}.choice svg{width:100%;height:auto;display:block}button:focus-visible{outline:2px solid #A85F45;outline-offset:5px}.strip{margin-top:22px;padding-top:16px;border-top:1px solid #DCD7CA;display:grid;grid-template-columns:1fr 1.5fr;gap:30px}.strip h2{font-size:12px;font-weight:400;margin:0 0 9px}.sizes svg{width:100%;height:125px;display:block}.palette{display:flex;gap:8px;margin:15px 0 14px}.swatch{width:32px;height:30px}.note{font-size:12px;line-height:1.9;max-width:360px;color:#706A5E;margin:0}.caption{margin-top:14px}.tag{font-size:10px;letter-spacing:1px;color:#A16B50}@media(max-width:650px){main{padding:25px 20px}header{align-items:start}h1{font-size:30px}.choices{gap:12px}.choice h2{display:block;font-size:12px}.choice h2 span{display:block;margin-top:3px}.strip{grid-template-columns:1fr;gap:18px}.sizes svg{height:105px}header small{max-width:120px}}
</style><main><header><div><div class="eyebrow">FOLIO / FORM STUDY 01</div><h1>从一块矩形开始。</h1></div><small>图形有一点笨拙，<br>排列保持克制。</small></header><section class="choices" aria-label="比较矩形边缘"></section><section class="strip"><div><h2>暂借这组颜色看形状</h2><div class="palette"></div><p class="note">同一套边缘，用在小色块、长条和大面。<br>空隙负责分区，色块负责表达。</p><p class="caption">点击 A / B / C，比较下方尺寸变化。</p></div><div class="sizes"><h2>放大和缩小，仍然是一家人 <span class="tag" id="current">B</span></h2><svg id="sizes" viewBox="0 0 420 125" aria-label="所选矩形的不同尺寸"></svg><p class="caption">手感先放在边缘。微小的弧度、偏差和颜色，都是这轮的试样。</p></div></section></main>
<script>
const NS='http://www.w3.org/2000/svg',colors=['#E9DBC5','#D5AA62','#CB795C','#8D9C76','#8CA6AD'],names=['规整一点','微微不齐','更像剪纸'];let selected=1;
const noise=(seed,n)=>{const v=Math.sin(seed*19.27+n*8.3)*43758.54;return(v-Math.floor(v))*2-1};
function shape(x,y,w,h,k,seed){const r=k===0?Math.min(3,w*.07):k===1?Math.min(2,w*.055):.7,j=k===0?0:k===1?Math.min(.8,w*.026):Math.min(1.8,w*.055),n=i=>noise(seed,i)*j;return `M${x+r} ${y+n(1)} Q${x+w*.48} ${y+n(2)} ${x+w-r} ${y+n(3)} Q${x+w+n(4)} ${y} ${x+w+n(5)} ${y+r} L${x+w+n(6)} ${y+h-r} Q${x+w} ${y+h+n(7)} ${x+w-r} ${y+h+n(8)} Q${x+w*.5} ${y+h+n(9)} ${x+r} ${y+h+n(10)} Q${x+n(11)} ${y+h} ${x+n(12)} ${y+h-r} L${x+n(13)} ${y+r} Q${x} ${y} ${x+r} ${y+n(1)}Z`}
function rect(svg,x,y,w,h,k,color,seed){const p=document.createElementNS(NS,'path');p.setAttribute('d',shape(x,y,w,h,k,seed));p.setAttribute('fill',color);svg.append(p);return p}
function sample(svg,k){const levels=[0,1,1,2,0,3,1,1,2,0,1,3,2,0,2,3,4,1,2,0,1,1,2,4,2,1,3,2];for(let i=0;i<28;i++)rect(svg,8+(i%7)*32,15+Math.floor(i/7)*32,25,25,k,['#E5E1D5','#DED0B5','#D6AE7A','#C88B66','#AE624B'][levels[i]],i+4);rect(svg,8,165,73,55,k,'#D7DDCC',63);rect(svg,90,165,133,16,k,'#9CA984',64);rect(svg,90,188,95,12,k,'#C5CDB5',65);rect(svg,90,207,117,12,k,'#DFE3D7',66)}
function pick(k){selected=k;document.querySelectorAll('.choice').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===k)));document.getElementById('current').textContent=' '+String.fromCharCode(65+k);const s=document.getElementById('sizes');s.replaceChildren();rect(s,5,37,25,25,k,colors[2],11);rect(s,44,36,54,28,k,colors[3],12);rect(s,112,36,125,28,k,colors[4],13);rect(s,255,15,148,85,k,colors[0],14);rect(s,268,29,65,12,k,'#D2B88E',15);rect(s,268,48,119,5,k,'#DFCFB5',16);rect(s,268,61,97,5,k,'#DFCFB5',17)}
for(let k=0;k<3;k++){const b=document.createElement('button');b.className='choice';b.type='button';b.innerHTML=`<h2>${String.fromCharCode(65+k)}　${names[k]}<span>${['边缘平直','边缘轻微起伏','偏差再多一点'][k]}</span></h2>`;const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 232 236');svg.setAttribute('aria-hidden','true');sample(svg,k);b.append(svg);b.onclick=()=>pick(k);document.querySelector('.choices').append(b)}
colors.forEach((c,i)=>{const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 32 30');s.classList.add('swatch');s.setAttribute('aria-hidden','true');rect(s,1,1,29,27,1,c,31+i);document.querySelector('.palette').append(s)});pick(1);
</script></html>
