<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio · 资讯组件</title>
<link rel="stylesheet" href="phone-usage.css"><style>
#news-card{width:260px;max-width:100%;aspect-ratio:1;container-type:inline-size}.news-square{width:100%;height:100cqw;background:#e2e6df;border-radius:5px;padding:6cqw;display:grid;grid-template-rows:1.8fr 1fr 1fr;gap:2.5cqw;overflow:hidden}.news-piece{position:relative;padding:3cqw 4cqw;border:0;border-radius:0;min-height:0;background:#f6f0e2;text-align:left;color:#81765c;display:flex;flex-direction:column;justify-content:center;box-shadow:2px 2px 0 #c4c9b6;overflow:hidden;outline-offset:2px}.news-piece:focus-visible{outline:2px solid #9aa58b}.news-piece:after{content:"";position:absolute;right:0;bottom:0;border-left:8px solid transparent;border-bottom:8px solid #e2d8c0}.news-piece.feature{display:grid;grid-template-columns:1fr 28%;gap:3cqw;align-items:center;background:#e9dbbd}.news-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font:700 clamp(12px,5.6cqw,15px)/1.45 "Songti SC",SimSun,serif;letter-spacing:0;color:#7e765e}.feature .news-title{font-size:clamp(14px,7cqw,19px);color:#8f7450;line-height:1.4}.news-meta{display:block;font:400 clamp(10px,4cqw,11px)/1.4 "Microsoft YaHei",sans-serif;color:#a59980;margin-top:4px}.news-art{width:100%;height:auto;display:block}.news-opened{position:absolute;right:9px;top:8px;width:4px;height:4px;border-radius:50%;background:#a5b18e}.news-body{font-size:14px;color:#887f6d;line-height:2}.news-byline{font-size:11px;color:#a1937b;margin:16px 0 20px}.news-piece.switching{animation:news-arrive .3s ease both}@keyframes news-arrive{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>
<main><header><div class="eyebrow">FOLIO / WIDGET 08</div><h1>几张纸片，留一点新鲜事。</h1><p>资讯组件粗样。标题、栏目和正文均为排版样稿，不是真实新闻。</p></header>
<section class="study"><div class="preview"><div id="news-card"></div><p class="caption">资讯 · 一则大标题，两则短消息</p><div class="sizes"><button data-size="260" aria-pressed="true">放大看细节</button><button data-size="180" aria-pressed="false">180px 实际大小</button></div></div><aside><h2>像随手夹下来的几则消息。</h2><p>一张重点剪报，两张小纸片。点开看正文和来源，卡片里不再加“新闻”栏目名。</p><button id="next-edition">换一则头条试试</button><p class="fine">这里先比较版面和阅读入口。新闻类别、可靠来源、更新频率，以及是否需要 AI 整理，之后看你是否想采用再定。</p><a href="focus.html">上一个：专注搭建 ↗</a></aside></section><footer>第八个组件的粗样；资讯仍是候选功能，未接入正式工作台。</footer></main>
<dialog id="news-detail" aria-labelledby="news-title"><form method="dialog"><button class="close" aria-label="关闭剪报"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></form><div class="eyebrow">排版样稿</div><h2 id="news-title"></h2><p id="news-byline" class="news-byline"></p><p id="news-body" class="news-body"></p><p class="fine">正式采用后，来源与原文入口放在这里。</p></dialog>
<script>
const examples=[{id:'wood',title:'旧木料，变成新的书架',source:'设计观察 · 样稿',body:'这里演示一篇较长的校园设计资讯如何阅读。正式接入后，这一段显示来自可靠来源的正文或摘要，并保留来源和原文链接。当前不对应真实校园活动。',color:'#c6976c',art:'wood'},{id:'robot',title:'机器人怎样拿稳杯子',source:'科技视野 · 样稿',body:'这里演示科技消息的阅读排版。标题和文字是示例，不代表某项真实研究的结论。正式内容应保留研究或报道来源。',color:'#8caaa5',art:'robot'},{id:'book',title:'一本书里的城市地图',source:'阅读角落 · 样稿',body:'这里演示阅读类消息。可以放文章简介，点开后继续阅读；是否收录这一类内容，仍由后续的资讯范围决定。',color:'#a5ae8b',art:'book'}];
let order=0,opened=new Set();const NS='http://www.w3.org/2000/svg',root=document.createElement('section');root.className='news-square';root.setAttribute('aria-label','资讯剪报');document.querySelector('#news-card').append(root);const dialog=document.querySelector('#news-detail');
function art(svg,kind){const add=(d,fill,stroke)=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);if(fill)p.setAttribute('fill',fill);else p.setAttribute('fill','none');if(stroke){p.setAttribute('stroke',stroke);p.setAttribute('stroke-width','2')}svg.append(p)};if(kind==='wood'){add('M4 16l40-4 3 45-40 4Z','#c8a272');add('M9 22l29-3 1 29-28 3Z','#eaddbb');add('M9 32l30-3 1 5-30 3Z','#b89568');add('M11 47l29-3 1 4-29 3Z','#b89568');add('M13 20l6-1 1 12-6 1Z','#92a28a');add('M23 19l7-1 1 12-7 1Z','#c58a6d');add('M14 38l6-1 1 10-6 1Z','#9ab4af')}else if(kind==='robot'){add('M9 25l31-2 3 25-32 2Z','#91aba5');add('M16 15l18-1 1 12-18 1Z','#b4c2af');add('M15 49l7-1v12l-8 1Z M33 48l7-1 2 11-8 1Z','#819a94');add('M12 32l-7 3 1 12 5-1M41 32l6 2-1 12-5-1Z','#a0b4a8');add('M22 26l1-6m7 6v-6',null,'#dce1cd')}else{add('M5 18l19 3 2 38-20-5Z','#b9c49f');add('M24 21l20-7 2 38-20 7Z','#d0d7b5');add('M24 21l2 38',null,'#8f9e7e');add('M10 28l10 1m-10 7 10 1m11-10 9-3m-9 11 10-3',null,'#9bac89')}}
function render(animate=false){root.replaceChildren();for(let i=0;i<3;i++){const item=examples[(order+i)%3],b=document.createElement('button');b.type='button';b.className='news-piece'+(i===0?' feature':'')+(animate?' switching':'');b.setAttribute('aria-label',item.title+'，'+item.source+'，打开样稿');const content=document.createElement('span'),title=document.createElement('span'),meta=document.createElement('span');title.className='news-title';title.textContent=item.title;meta.className='news-meta';meta.textContent=item.source;content.append(title,meta);b.append(content);if(i===0){const image=document.createElementNS(NS,'svg');image.setAttribute('viewBox','0 0 52 72');image.setAttribute('aria-hidden','true');image.classList.add('news-art');art(image,item.art);b.append(image)}if(opened.has(item.id)){const mark=document.createElement('i');mark.className='news-opened';mark.setAttribute('aria-hidden','true');b.append(mark)}b.onclick=()=>{opened.add(item.id);document.querySelector('#news-title').textContent=item.title;document.querySelector('#news-byline').textContent=item.source;document.querySelector('#news-body').textContent=item.body;dialog.showModal();b.dataset.opened='true'};root.append(b)}}
document.querySelector('#next-edition').onclick=()=>{order=(order+1)%3;render(true)};document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.querySelector('#news-card').style.width=b.dataset.size+'px';document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
let closeTimer;function closePanel(){if(dialog.classList.contains('is-closing'))return;if(matchMedia('(prefers-reduced-motion: reduce)').matches){dialog.close();return}dialog.classList.add('is-closing');closeTimer=setTimeout(()=>dialog.close(),220)}dialog.querySelector('form').addEventListener('submit',e=>{e.preventDefault();closePanel()});dialog.addEventListener('cancel',e=>{e.preventDefault();closePanel()});dialog.addEventListener('close',()=>{clearTimeout(closeTimer);dialog.classList.remove('is-closing')});dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closePanel()}});render();
</script><script>const next=document.createElement('a');next.href='book-stack.html';next.textContent='下一个：学期课本堆 ↗';next.style.display='block';next.style.marginTop='20px';document.querySelector('aside').append(next);</script><script src="widget-frame.js"></script></html>
