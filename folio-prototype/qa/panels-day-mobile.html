<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio · 面板与日列预览</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#e6e1d9;color:#625a4d;font-family:system-ui,sans-serif}body{display:flex;flex-direction:column;align-items:center}nav{height:42px;flex:none;display:flex;align-items:center;gap:6px;font-size:11px}button{border:0;border-radius:8px;background:#f6f3ec;color:inherit;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:#826f5d;color:#fff}iframe{display:block;flex:1;min-height:0;border:0;width:min(390px,100vw);background:#f9f9f7}@media(min-width:500px){iframe{max-height:844px}}</style>
<nav aria-label="虚构数据预览"><span>预览</span><button data-view="reminders" aria-pressed="true">提醒</button><button data-view="order" aria-pressed="false">排序</button><button data-view="day" aria-pressed="false">日列</button><button id="theme">明／暗</button></nav>
<iframe title="Folio面板预览，仅使用本地虚构学校接口" src="relationships-app.html?v=panels-day1"></iframe>
<script>
const frame=document.querySelector('iframe');let active='reminders';
function show(view){const w=frame.contentWindow;if(!w.FolioReminders)return;active=view;w.FolioChatUI.closePanel(true,false);w.FolioHomeWeek.close(true);w.showPreviewScreen(view==='day'?'home':'settings',{focus:false});if(view==='reminders')w.FolioReminders.open();else if(view==='order')w.FolioPageRail.openPages();else w.FolioHomeWeek.open();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));w.document.getElementById('qa-native-status')?.parentElement?.setAttribute('hidden','');}
frame.onload=()=>show(active);document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));document.getElementById('theme').onclick=()=>{const w=frame.contentWindow;w.FolioTheme.set(w.document.documentElement.dataset.theme==='dark'?'light':'dark');};
</script></html>
