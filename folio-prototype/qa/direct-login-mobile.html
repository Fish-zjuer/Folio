<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio · 登录失败反馈</title><style>body{margin:0;background:#e7e4db;font:13px/1.6 system-ui;color:#6b655a}main{width:390px;max-width:100%;margin:12px auto}header{padding:0 12px 10px}button{font:inherit;padding:7px 10px;border:0;border-radius:9px;background:#d5ded3;color:inherit;margin:4px 3px 0 0}iframe{display:block;width:100%;height:844px;border:0;border-radius:17px}p{margin:4px 0;font-size:12px}</style><main><header><strong>学校连接 · 失败原因直接显示</strong><p>虚构失败，不连接学校。此页只验反馈界面。</p><button id="run">检查反馈</button><p id="status">等待检查</p></header><iframe id="app" src="direct-login-integration.html" title="登录反馈手机预览"></iframe></main><script>const app=document.getElementById('app'),status=document.getElementById('status');document.getElementById('run').onclick=()=>{app.contentDocument.querySelector('#login-qa-tools button').click();status.textContent='检查中…';};window.addEventListener('message',e=>{if(e.source!==app.contentWindow||e.origin!==location.origin||!e.data.directLoginQA)return;const r=e.data.directLoginQA;status.textContent=r.passed?r.checks.length+' 项反馈检查通过':JSON.stringify(r);});</script></html>
