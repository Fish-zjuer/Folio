<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio · 卡片二级菜单</title><style>body{margin:0;background:#e7e3d9;color:#645e51;font:13px/1.6 system-ui}main{width:390px;max-width:100%;margin:12px auto}header{padding:0 14px 12px}header p{font-size:12px;margin:4px 0}button{font:inherit;padding:8px 12px;border:0;border-radius:10px;color:inherit;background:#d2ded5}iframe{width:100%;height:820px;border:0;border-radius:20px;display:block}#status{color:#6a877f}</style><main><header><strong>卡片 → 对应内容 → 下一步</strong><p>虚构数据 · 点卡片中不同区域试试</p><button id="run" disabled>检查所有学习卡片</button> <button id="width">390 → 320</button><button id="tools">隐藏工具</button><p id="status"></p></header><iframe id="app" src="study-menu-integration.html" title="手机菜单预览"></iframe></main><script>const app=document.getElementById('app'),run=document.getElementById('run'),status=document.getElementById('status');run.onclick=()=>{const buttons=[...app.contentDocument.querySelectorAll('#menu-qa-controls button')];buttons.find(b=>b.textContent==='运行检查')?.click();status.textContent='检查中…';};window.addEventListener('message',e=>{if(e.source!==app.contentWindow||e.origin!==location.origin)return;if(e.data.menuQARunning)status.textContent='回归检查中…';if(e.data.menuQAReady){run.disabled=false;status.textContent='预览已就绪';}if(e.data.menuQA)status.textContent=e.data.menuQA.passed?e.data.menuQA.count+' 项通过':JSON.stringify(e.data.menuQA);});document.getElementById('tools').onclick=()=>{const n=app.contentDocument.getElementById('menu-qa-controls');n.style.display=n.style.display==='none'?'flex':'none';};document.getElementById('width').onclick=()=>{const main=document.querySelector('main');main.style.width=main.style.width==='320px'?'390px':'320px';};</script></html>
