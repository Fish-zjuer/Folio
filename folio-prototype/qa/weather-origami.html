<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio · 折纸天气</title><style>
*{box-sizing:border-box}body{margin:0;background:#F9F9F7;color:#928570;font:14px Georgia,SimSun,serif}main{max-width:470px;margin:0 auto;padding:32px 22px}h1{font-size:22px;font-weight:400;margin:0 0 12px}p{font-size:12px;line-height:1.8;color:#AAA18F;margin:0 0 25px}.icons{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#F0EEE5;border-radius:12px}.tile:nth-child(3n+2){background:#E9EDE5}.tile:nth-child(3n){background:#ECECEE}.tile svg{width:64px;height:61px}.tile span{font-size:12px;letter-spacing:2px}a{display:inline-block;margin-top:25px;color:#9A886C;font-size:12px;text-decoration:none}.workbench-weather{display:none}</style><main><h1>折纸天气</h1><p>直线轮廓 · 纸片折面 · 实际显示仍由天气数据决定</p><div class="icons"></div><a href="live-services-mobile.html">回到工作台预览 →</a></main><div class="workbench-weather"></div><script>window.FolioLiveData={weather:()=>({city:{name:'杭州'}})};</script><script src="../weather-ui.js?v=origami2"></script><script>for(const [kind,label] of [['sun','晴'],['partly','多云'],['cloud','阴'],['rain','雨'],['snow','雪'],['storm','雷雨'],['moon','晴夜'],['night-cloud','多云夜'],['fog','雾']]){const tile=document.createElement('div');tile.className='tile';const labelNode=document.createElement('span');labelNode.textContent=label;tile.append(FolioWeatherUI.icon(kind),labelNode);document.querySelector('.icons').append(tile);}</script></html>
