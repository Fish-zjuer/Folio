<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio · 确认卡片预览</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#e6e1d9;color:#625a4d;font-family:system-ui,sans-serif}body{display:flex;flex-direction:column;align-items:center}nav{height:42px;flex:none;display:flex;align-items:center;gap:6px;font-size:11px}button{border:0;border-radius:8px;background:#f6f3ec;color:inherit;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:#826f5d;color:#fff}iframe{display:block;flex:1;min-height:0;border:0;width:min(390px,100vw);background:#f9f9f7}@media(min-width:500px){iframe{max-height:844px}}</style>
<nav aria-label="虚构数据预览"><span>预览</span><button data-count="1" aria-pressed="true">单张修改</button><button data-count="3" aria-pressed="false">多张修改</button><button id="theme">明／暗</button></nav>
<iframe title="Folio 确认卡片，仅使用本地虚构数据" src="relationships-app.html?v=confirmation14"></iframe>
<script>
const frame=document.querySelector('iframe');
function show(count){const w=frame.contentWindow;if(!w.FolioChatUI)return;w.FolioChatUI.closePanel(true,false);w.showPreviewScreen('home',{focus:false});const state=w.FolioChatUI.state(),c=w.FolioChat.conversation(state);c.proposals=Array.from({length:count},(_,i)=>({id:'qa-confirm-'+i,messageId:'qa-message',status:'pending',operation:'create_lesson',fields:{title:i?'实验安排 '+(i+1):'电路实验 · 分组实训',kind:'lesson',timeMode:'range',startAt:'2026-12-11T13:30',endAt:'2026-12-11T16:00',body:'分组：第2组（据实训安排表）',important:false,urgent:false,placements:['calendar','timetable'],queued:false,completed:false},before:null,createdAt:new Date().toISOString()}));w.FolioChatUI.render();w.FolioChatUI.openProposalDeck(w.FolioChat.pending(state));w.document.getElementById('qa-native-status')?.parentElement?.setAttribute('hidden','');document.querySelectorAll('[data-count]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.count)===count)));}
frame.onload=()=>show(1);document.querySelectorAll('[data-count]').forEach(b=>b.onclick=()=>show(Number(b.dataset.count)));document.getElementById('theme').onclick=()=>{const w=frame.contentWindow;w.FolioTheme.set(w.document.documentElement.dataset.theme==='dark'?'light':'dark');};
</script></html>
