<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio · 卡片包</title><style>body{margin:0;background:#e7e4db;font:13px/1.6 system-ui;color:#6b655a}main{width:390px;max-width:100%;margin:12px auto}header{padding:0 12px 10px}button{font:inherit;padding:7px 10px;border:0;border-radius:9px;background:#d5ded3;color:inherit;margin:4px 3px 0 0}iframe{display:block;width:100%;height:844px;border:0;border-radius:17px}p{margin:4px 0;font-size:12px}</style><main><header><strong>卡片包 · 灰色托盘</strong><p>虚构数据，横滑包内卡片；长按整个托盘可管理。</p><button id="run" disabled>准备并检查</button><button id="width">390 / 320</button><button id="theme">深色 / 浅色</button><button id="tools">隐藏工具</button><button id="selection">选中效果</button><p id="status">加载中…</p></header><iframe id="app" src="card-pack-integration.html" title="卡片包手机预览"></iframe></main><script>const app=document.getElementById('app'),run=document.getElementById('run'),status=document.getElementById('status');run.onclick=()=>{app.contentDocument.querySelector('#pack-qa-controls button').click();status.textContent='检查中…';};window.addEventListener('message',e=>{if(e.source!==app.contentWindow||e.origin!==location.origin)return;if(e.data.packReady){run.disabled=false;status.textContent='预览已就绪';}if(e.data.packQA)status.textContent=e.data.packQA.passed?e.data.packQA.count+' 项检查通过':JSON.stringify(e.data.packQA);});document.getElementById('selection').onclick=()=>app.contentDocument.getElementById('pack-qa-selection').click();document.getElementById('width').onclick=()=>{const m=document.querySelector('main');m.style.width=m.style.width==='320px'?'390px':'320px';};document.getElementById('theme').onclick=()=>{app.contentDocument.getElementById('pack-theme-toggle').click();};document.getElementById('tools').onclick=()=>{const n=app.contentDocument.getElementById('pack-qa-controls');n.style.display=n.style.display==='none'?'block':'none';};</script></html>
