<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio · 课程安排与多位置</title><style>body{margin:0;background:#e9e5dc;font:14px/1.6 system-ui;color:#756552}main{max-width:390px;margin:12px auto}header{padding:0 12px 10px}button{font:inherit;border:0;border-radius:12px;background:#d7e1d8;padding:7px 12px;color:inherit}iframe{display:block;width:100%;height:844px;border:0;border-radius:18px}p{margin:6px 0;font-size:12px}</style><main><header><button id="run">运行手机尺寸检查</button><p id="status">虚构数据 · 课程安排、多个提醒及展示位置；未打包</p></header><iframe id="app" src="item-routing-integration.html" title="事项编辑器手机预览"></iframe></main><script>const frame=document.getElementById('app'),run=document.getElementById('run'),status=document.getElementById('status');run.onclick=()=>{const doc=frame.contentDocument,button=doc.getElementById('run-item-checks');if(!button)return;run.disabled=true;status.textContent='检查中…';button.click();const timer=setInterval(()=>{const result=doc.getElementById('item-check-results');if(!result.textContent||result.textContent==='检查中…')return;clearInterval(timer);run.disabled=false;try{const value=JSON.parse(result.textContent);status.textContent=value.passed?value.count+' 项手机流程检查通过 · 虚构数据':value.error;if(value.passed){button.hidden=true;result.hidden=true;doc.querySelector('body>aside')?.remove();doc.querySelector('.item-display-options')?.scrollIntoView({block:'end'});}}catch(e){status.textContent=e.message;}},100);};</script></html>
