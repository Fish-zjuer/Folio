<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio · 折纸图标</title><style>*{box-sizing:border-box}body{margin:0;background:#F9F9F7;color:#36362E;font:15px Georgia,SimSun,serif}main{max-width:700px;padding:64px 28px;margin:auto}h1{font-weight:400;font-size:28px;margin:0 0 14px}p{color:#8F8878;line-height:1.8}section{margin:44px 0;display:flex;gap:36px;align-items:end;flex-wrap:wrap}figure{margin:0;display:grid;gap:12px;justify-items:center}img{display:block;width:var(--size);height:var(--size);border-radius:23%}figcaption{color:#918978;font-size:12px}.circle{border-radius:50%}.tile{background:#E9E3D6;padding:30px;border-radius:24px;display:flex;align-items:center;gap:16px}.name{font-size:24px}.small{font:12px sans-serif;color:#918978;margin-top:6px}.night{background:#282A25}.night .name{color:#E8E0D2}</style><main><h1>Folio</h1><p>一张折起的纸。保留 F 的辨识度，用直线折面和硬投影表现纸感。</p><section><figure><img src="../assets/folio-icon.svg" style="--size:160px"><figcaption>完整图形</figcaption></figure><figure><img src="../assets/folio-icon.svg" style="--size:72px"><figcaption>桌面尺寸</figcaption></figure><figure><img class="circle" src="../assets/folio-icon.svg" style="--size:56px"><figcaption>圆形裁切</figcaption></figure><figure><img src="../assets/folio-icon.svg" style="--size:32px"><figcaption>小尺寸</figcaption></figure></section><section class="tile"><img src="../assets/folio-icon.svg" style="--size:64px"><div class="name">Folio<div class="small">Fish</div></div></section><section class="tile night"><img class="circle" src="../assets/folio-icon.svg" style="--size:64px"><div class="name">Folio<div class="small">Fish</div></div></section><p>已同步 Android 自适应图标与网页图标；下一次 APK 构建生效。</p></main></html>
