<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>App 集成 · 手机视窗</title><style>body{margin:20px;background:#eeeae1;color:#87765a;font:13px Georgia,SimSun,serif}nav{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}button{padding:12px;border:1px solid #c8b993;background:#f3ecdd;color:inherit;border-radius:4px}iframe{display:block;border:1px solid #c8b993;width:412px;height:892px;border-radius:8px;background:#f9f9f7}</style><nav><button data-page="feedback-06.html">0.6 反馈</button><button data-page="app-integration.html">组件与 SDK</button><button data-page="review-05.html">0.5 反馈</button><button data-height="892">412 × 892</button><button data-height="692">412 × 692</button><button id="toggle-reports" aria-pressed="false">隐藏检查报告</button></nav><iframe title="App 手机视窗" src="review-05.html"></iframe><script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>frame.src=b.dataset.page);document.querySelectorAll('[data-height]').forEach(b=>b.onclick=()=>frame.style.height=b.dataset.height+'px');document.querySelector('#toggle-reports').onclick=e=>{const hide=e.currentTarget.getAttribute('aria-pressed')!=='true';frame.contentDocument.querySelectorAll('body > aside').forEach(p=>p.hidden=hide);e.currentTarget.setAttribute('aria-pressed',String(hide));e.currentTarget.textContent=hide?'显示检查报告':'隐藏检查报告'};frame.addEventListener('load',()=>{const b=document.querySelector('#toggle-reports');b.setAttribute('aria-pressed','false');b.textContent='隐藏检查报告'})</script></html>
