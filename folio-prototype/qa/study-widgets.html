<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio · 学习卡片与首页</title>
<link rel="stylesheet" href="../widgets/study/study.css"><style>*{box-sizing:border-box}body{margin:0;background:#FAF8F5;color:#6B5A4A;font:14px/1.7 Georgia,STSong,serif}header{max-width:900px;margin:30px auto;padding:0 20px}h1{font-weight:500;font-size:27px;margin:0 0 5px}p{font-size:13px;color:#96846F;margin:0}nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}button{background:#E9E4DA;border:0;border-radius:18px;padding:9px 17px;color:#6B5A4A;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#7E9E9A;color:#FAF8F5}#gallery{max-width:472px;padding:0 16px 60px;margin:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}figure{margin:0;min-width:0}figure>div{aspect-ratio:1;width:100%;border-radius:28px;overflow:hidden}figcaption{display:none}#mobile{display:none;margin:0 auto 40px;width:390px;max-width:100%;height:844px;border:0;border-radius:20px;background:#F9F9F7}#gallery[hidden]{display:none}#mobile:not([hidden]){display:block}@media(max-width:650px){#gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}header{margin-top:20px}figure>div{border-radius:28px}}</style>
<header><h1>纸上的学习工作台</h1><p>18 枚独立图形 · 8 枚三分区便当。此页缩略图为示例；手机页接应用数据与操作。</p><nav><button id="bento" aria-pressed="true">组合版</button><button id="single" aria-pressed="false">独立版</button><button id="phone" aria-pressed="false">手机内预览</button><button id="check">运行功能检查</button><button id="backend">检查学习后端</button><button id="width">390 → 320</button></nav></header>
<main id="gallery"></main><iframe id="mobile" title="真实应用 · 虚构测试数据" src="study-integration.html" hidden></iframe><pre id="checks" hidden></pre>
<script>const frame=document.getElementById('mobile'),gallery=document.getElementById('gallery');let view='bento';function render(){if(!frame.contentWindow.FolioStudyWidgets)return;gallery.replaceChildren();const api=frame.contentWindow.FolioStudyWidgets;for(const entry of api[view==='bento'?'composites':'defs']){const f=document.createElement('figure'),square=document.createElement('div'),slot=document.createElement('div'),title=document.createElement('figcaption');square.append(slot);api.preview(slot,entry.id);title.textContent=entry.name;f.append(square,title);gallery.append(f);}}frame.onload=render;for(const v of ['bento','single','phone'])document.getElementById(v).onclick=()=>{for(const k of ['bento','single','phone'])document.getElementById(k).setAttribute('aria-pressed',String(k===v));gallery.hidden=v==='phone';frame.hidden=v!=='phone';if(v!=='phone'){view=v;render();}};document.getElementById('width').onclick=e=>{frame.style.width=frame.style.width==='320px'?'430px':frame.style.width==='430px'?'390px':'320px';e.target.textContent='手机宽度 '+frame.style.width;};document.getElementById('backend').onclick=()=>runChecks('runStudyBackendChecks');document.getElementById('check').onclick=()=>runChecks('runStudyChecks');async function runChecks(method){document.getElementById('phone').click();const out=document.getElementById('checks');out.hidden=false;out.style='max-width:900px;max-height:220px;overflow:auto;margin:auto;padding:20px;white-space:pre-wrap';out.textContent='检查中…';try{out.textContent=JSON.stringify(await frame.contentWindow[method](),null,2);}catch(e){out.textContent=String(e);} };</script></html>
